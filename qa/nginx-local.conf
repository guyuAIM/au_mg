events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  absolute_redirect off;
  server {
    listen 8080;
    server_name localhost;
    include /etc/nginx/geo/nginx-geo-static.conf;
    include /etc/nginx/geo/legacy-guide-redirects.conf;
    location = / { root /srv/mg-geo/dist; try_files /index.html =404; }
    location = /index.html { root /srv/mg-geo/dist; try_files /index.html =404; }
    location / { return 404; }
  }
  server {
    listen 8081;
    server_name localhost;
    add_header Content-Security-Policy "script-src 'none'" always;
    include /etc/nginx/geo/nginx-geo-static.conf;
    include /etc/nginx/geo/legacy-guide-redirects.conf;
    location = / { root /srv/mg-geo/dist; try_files /index.html =404; }
    location / { return 404; }
  }
  server {
    listen 8082;
    server_name localhost;
    include /etc/nginx/geo/nginx-geo-static.conf;
    include /etc/nginx/geo/legacy-guide-redirects.conf;
    location = / { return 200 'Existing MG root preserved'; }
    location = /robots.txt { return 200 'Existing MG robots preserved'; }
    location = /sitemap.xml { return 200 'Existing MG sitemap preserved'; }
    location = /about/faqs { return 200 'Existing MG FAQ preserved'; }
    location = /vehicles/mgs6-ev { return 200 'Existing MG model preserved'; }
    location / { return 404; }
  }
}
