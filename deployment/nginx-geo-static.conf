# Include in the existing MG server block; replace /srv/mg-geo/dist with the release directory.
# Include legacy-guide-redirects.conf in that same server block.
# No root page, server-wide root, robots policy or existing main sitemap is replaced.
set $mg_evguide_dir /srv/mg-geo/dist;
location = /explore/ev-guides { root $mg_evguide_dir; try_files /index.html =404; }
location = /explore/ev-guides/ { return 301 /explore/ev-guides; }
location = /explore/ev-guides/index.html { return 301 /explore/ev-guides; }
location ^~ /explore/ev-guides/assets/ { alias $mg_evguide_dir/assets/; autoindex off; }
location ^~ /explore/ev-guides/scripts/ { alias $mg_evguide_dir/scripts/; autoindex off; }
location ~ ^/explore/ev-guides/(?<mg_evguide_slug>[a-z0-9]+(?:-[a-z0-9]+)*)(?<mg_evguide_suffix>/index[.]html|/)?$ {
  root $mg_evguide_dir;
  if (!-f $mg_evguide_dir/$mg_evguide_slug/index.html) { return 404; }
  if ($mg_evguide_suffix != "") { return 301 /explore/ev-guides/$mg_evguide_slug; }
  try_files /$mg_evguide_slug/index.html =404;
}
location = /sitemap_evguide.xml { root $mg_evguide_dir; default_type application/xml; try_files /sitemap_evguide.xml =404; }
location /explore/ev-guides/ { return 404; }
